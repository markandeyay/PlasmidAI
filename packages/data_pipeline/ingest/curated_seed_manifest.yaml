version: "2026-05-29-p0"
description: >
  Curated Phase 0 seed set for parser calibration. This first manifest includes
  only NCBI GenBank accessions identified by the A-track curation agents as
  confident full-sequence sources. Addgene-only and ambiguous family-name
  candidates are intentionally excluded pending provenance/legal review.
vectors:
  - id: pGEX-4T-1
    name: pGEX-4T-1
    source: ncbi_genbank
    accession: U13853.1
    vector_family: bacterial_expression
    expected_features: [tac promoter, GST, AmpR, pBR322 ori]
    citations:
      - https://www.ncbi.nlm.nih.gov/nuccore/U13853.1
      - https://www.ecoliwiki.org/colipedia/index.php/pGEX-4T-1
